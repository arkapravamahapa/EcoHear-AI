services:
  - type: web
    name: ecohear-api
    runtime: python
    region: singapore
    plan: free
    rootDir: ecohear-backend
    buildCommand: pip install -r requirements.txt && mkdir -p uploads
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GEMINI_API_KEY
        sync: false